version: '3.8'

services:
  ferrous-dns:
    image: ghcr.io/ferrousnetworking/ferrous-dns:latest
    container_name: ferrous-dns
    restart: unless-stopped

    # Host networking is required for mDNS/Bonjour device discovery: multicast on
    # UDP 5353 does not traverse Docker bridge port mapping. Host mode also binds
    # the DNS/web ports directly on the host, so no `ports:` mapping is used.
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - ferrous-data:/data
      - ./ferrous-dns.toml:/data/config/ferrous-dns.toml:ro

    environment:
      - FERROUS_CONFIG=/data/config/ferrous-dns.toml
      - FERROUS_DNS_PORT=53
      - FERROUS_WEB_PORT=8080
      - FERROUS_BIND_ADDRESS=0.0.0.0
      - FERROUS_DATABASE=/data/db/ferrous.db
      - FERROUS_LOG_LEVEL=info
      - RUST_LOG=info
      - TZ=America/Sao_Paulo

    healthcheck:
      test: ["/usr/local/bin/ferrous-dns", "--version"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 60

volumes:
  ferrous-data:
    driver: local
