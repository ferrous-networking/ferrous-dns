services:
  ferrous-dns:
    image: ferrousnetworking/ferrous-dns:latest
    container_name: ferrous-dns
    restart: unless-stopped

    # Matches the `ferrous` user baked into the image (Dockerfile: uid/gid 1000).
    # Pinned explicitly so the container never runs as root even if the image
    # changes; the binary carries cap_net_bind_service via setcap, and cap_add
    # below keeps the capability available in the bounding set on hosts/orchestrators
    # that strip Docker's default capability profile.
    user: "1000:1000"

    # Host networking is required for mDNS/Bonjour device discovery: multicast on
    # UDP 5353 does not traverse Docker bridge port mapping. Host mode also binds
    # the DNS/web ports directly on the host, so no `ports:` mapping is used.
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE

    # Must stay writable (not `:ro`): the first-run setup wizard, POST /config from
    # the dashboard, and backup restore all persist changes back to this file
    # (TomlConfigFilePersistence writes directly to the path in FERROUS_CONFIG).
    volumes:
      - ferrous-data:/data
      - ./ferrous-dns.toml:/data/config/ferrous-dns.toml

    environment:
      - FERROUS_CONFIG=/data/config/ferrous-dns.toml
      - FERROUS_DNS_PORT=53
      - FERROUS_WEB_PORT=8080
      - FERROUS_BIND_ADDRESS=0.0.0.0
      - FERROUS_DATABASE=/data/db/ferrous.db
      - FERROUS_LOG_LEVEL=info
      - RUST_LOG=info
      - TZ=America/Sao_Paulo

    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrous-dns", "--version"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 60

volumes:
  ferrous-data:
    driver: local
