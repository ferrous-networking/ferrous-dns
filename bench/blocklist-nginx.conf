# Static file server for the benchmark blocklist fixtures.
#
# Scenarios B and C need the blocklist to be reachable over HTTP: ferrous-dns
# only feeds its suffix trie and Aho-Corasick automaton from text fetched via
# blocklist_sources.url (crates/infrastructure/src/dns/block_filter/compiler.rs),
# never from the blocklist table. Blocky and AdGuard Home consume the same URL,
# which is what keeps the three servers on an identical rule set.
#
# Runs on host networking, port 8081. Only active while a server compiles its
# index — it is idle during measurement, so it is left unpinned.
server {
    listen      8081;
    server_name _;
    root        /usr/share/nginx/html;

    access_log  off;
    sendfile    on;
    tcp_nopush  on;

    location / {
        autoindex on;
    }
}
