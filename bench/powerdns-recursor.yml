# PowerDNS Recursor v5 — YAML config (ferrous-dns benchmark)
# Fair comparison: same upstream (the local stub), cache enabled, log info,
# rate limiting disabled

incoming:
  listen:
    - "0.0.0.0:5358"

recursor:
  threads: 8   # matches the server cpuset (lower half of host cores)
  forward_zones_recurse:
    - zone: "."
      forwarders:
        # Local catch-all stub (see stub-upstream.conf)
        - "127.0.0.1:5300"

outgoing:
  # Recursor's default dont_query list includes 127.0.0.0/8, which would silently
  # refuse every query to the stub upstream. Clearing it is required here and
  # harmless: the only forwarder configured is the stub.
  dont_query: []

recordcache:
  max_entries: 500000

packetcache:
  max_entries: 500000

logging:
  loglevel: 5

dnssec:
  validation: "off"
