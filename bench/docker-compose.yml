# =============================================================================
# ferrous-dns Competitor Benchmark — Docker Compose
# =============================================================================
# Starts ferrous-dns, Pi-hole, AdGuard Home, Unbound, and Blocky on local ports.
# All servers use the same plain UDP upstreams (8.8.8.8 / 1.1.1.1),
# blocking disabled, logging at info level, and caching enabled for a
# realistic production-like comparison.
#
# Usage:
#   docker compose -f bench/docker-compose.yml up -d
#   ./bench/benchmark.sh --no-docker
#   docker compose -f bench/docker-compose.yml down
#
# CPU pinning: benchmark.sh exports BENCH_SERVER_CPUS / BENCH_SERVER_NCPU so the
# server-under-test runs on a different core set than the dnsperf load generator.
# Run by hand without those vars and it defaults to cpuset 0-15 / cpus 16.
#
# Ports (host networking — each server binds directly on the host):
#   ferrous-dns:  0.0.0.0:5353/udp+tcp
#   Pi-hole:      0.0.0.0:5354/udp+tcp
#   AdGuard Home: 0.0.0.0:5359/udp+tcp  (5355 avoided — LLMNR / systemd-resolved)
#   Unbound:      0.0.0.0:5356/udp+tcp
#   Blocky:       0.0.0.0:5357/udp+tcp
#   PowerDNS:     0.0.0.0:5358/udp+tcp
#   blocklist:    0.0.0.0:8081/tcp      (static HTTP, scenarios B and C only)
#   stub upstream:127.0.0.1:5300/udp+tcp
#
# Config paths are overridable so benchmark.sh can render a per-scenario config
# (blocking on/off, query log on/off) into bench/.run/ without touching the
# tracked files.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # stub-upstream — local catch-all authoritative responder (see stub-upstream.conf)
  # Every server forwards here. Cache misses cost a loopback round-trip instead
  # of an internet round-trip, which is what makes a working set larger than the
  # caches measurable at all. Pinned to the load-generator cores.
  # ---------------------------------------------------------------------------
  stub-upstream:
    image: mvance/unbound:latest
    container_name: bench-stub-upstream
    network_mode: host
    volumes:
      - ./stub-upstream.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    cpuset: "${BENCH_LOADGEN_CPUS:-0-15}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "drill", "-p", "5300", "probe.bench.invalid", "@127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # ---------------------------------------------------------------------------
  # blocklist-server — serves the generated blocklist fixtures over HTTP
  # Only needed by scenarios B and C. Idle during measurement, so unpinned.
  # ---------------------------------------------------------------------------
  blocklist-server:
    image: nginx:alpine
    container_name: bench-blocklist-server
    network_mode: host
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./blocklist-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/blocklist.txt"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # ---------------------------------------------------------------------------
  # ferrous-dns — high-performance DNS server (Rust)
  # Config: docker/bench/ferrous-dns-config.toml
  #   - Plain UDP upstreams (8.8.8.8 / 1.1.1.1), strategy: Parallel
  #   - Blocking/query log toggled per scenario via BENCH_FERROUS_CONFIG
  #   - Caching enabled — production-like settings (200k entries, hit_rate eviction)
  #   - Log level: info
  # ---------------------------------------------------------------------------
  ferrous-dns:
    build:
      context: ..
      dockerfile: bench/Dockerfile.ferrous
    image: ferrousnetworking/ferrous-dns:latest
    container_name: bench-ferrous-dns
    network_mode: host
    volumes:
      - ${BENCH_FERROUS_CONFIG:-./ferrous-dns-config.toml}:/data/config/ferrous-dns-config.toml:ro
      # Host-visible database: the harness seeds blocklist_sources here with
      # sqlite3 between the migration boot and the measured boot.
      - ./.run/db:/data/db
    environment:
      FERROUS_CONFIG: /data/config/ferrous-dns-config.toml
      FERROUS_DNS_PORT: 5353
      FERROUS_WEB_PORT: 9090
      FERROUS_BIND_ADDRESS: 0.0.0.0
      FERROUS_DATABASE: /data/db/ferrous-bench.db
      FERROUS_LOG_LEVEL: info
      RUST_LOG: info
      TZ: UTC
    cpuset: "${BENCH_SERVER_CPUS:-0-15}"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${BENCH_SERVER_NCPU:-16}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrous-dns", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Pi-hole — DNS blocker (primary competitor)
  # ---------------------------------------------------------------------------
  pihole:
    image: pihole/pihole:latest
    container_name: bench-pihole
    network_mode: host
    environment:
      TZ: UTC
      WEBPASSWORD: bench123
      # Pi-hole v6 (FTL) — all configuration via pihole.toml (mounted below).
      # DNSMASQ_LISTENING / DNSMASQ_OPTS are v5-only env vars, ignored by FTL v6.
      FTLCONF_dns_port: "5354"
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ./pihole.toml:/etc/pihole/pihole.toml:ro
    cpuset: "${BENCH_SERVER_CPUS:-0-15}"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${BENCH_SERVER_NCPU:-16}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dig", "+short", "+timeout=2", "-p", "5354", "google.com", "@127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # AdGuard Home — DNS blocker + DoH/DoT support
  # GOMAXPROCS=8 — matches the server cpuset (lower half of host cores)
  # ---------------------------------------------------------------------------
  adguard:
    image: adguard/adguardhome:latest
    container_name: bench-adguard
    network_mode: host
    environment:
      GOMAXPROCS: 8
    volumes:
      # Both directories are scratch: the harness wipes them and copies the
      # scenario's template from adguard-templates/ before each start. AdGuard
      # rewrites its config in place (fatal under :ro) and re-chowns it to
      # root:0600, which is why the tracked templates are never mounted directly.
      - ./.run/adguard-work:/opt/adguardhome/work
      - ./.run/adguard-conf:/opt/adguardhome/conf
    cpuset: "${BENCH_SERVER_CPUS:-0-15}"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${BENCH_SERVER_NCPU:-16}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Unbound — high-performance recursive DNS resolver
  # num-threads: 16 — matches CPU limit
  # ---------------------------------------------------------------------------
  unbound:
    image: mvance/unbound:latest
    container_name: bench-unbound
    network_mode: host
    volumes:
      - ./unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    cpuset: "${BENCH_SERVER_CPUS:-0-15}"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${BENCH_SERVER_NCPU:-16}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "drill", "-p", "5356", "google.com", "@127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Blocky — fast DNS proxy and ad-blocker (Go)
  # Config: docker/bench/blocky-config.yml
  #   - Plain UDP upstreams (8.8.8.8 / 1.1.1.1), strategy: parallel_best
  #   - Blocking toggled per scenario via BENCH_BLOCKY_CONFIG
  #   - Caching enabled (minTime: 60s, maxTime: 86400s, prefetching: true)
  #   - Log level: info
  # GOMAXPROCS=8 — matches the server cpuset (lower half of host cores)
  # ---------------------------------------------------------------------------
  blocky:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: bench-blocky
    network_mode: host
    environment:
      GOMAXPROCS: 8
    volumes:
      - ${BENCH_BLOCKY_CONFIG:-./blocky-config.yml}:/app/config.yml:ro
    cpuset: "${BENCH_SERVER_CPUS:-0-15}"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${BENCH_SERVER_NCPU:-16}"
    restart: unless-stopped
    # Blocky runs on a scratch image (no shell/wget/dig), so its built-in
    # healthcheck subcommand is the only option. It defaults to port 53 and must
    # be told the real one, otherwise it fails for 50s before compose gives up.
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck", "--port", "5357"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PowerDNS Recursor — high-performance recursive resolver (C++)
  # Config: bench/powerdns-recursor.conf
  #   - Plain UDP upstreams (8.8.8.8 / 1.1.1.1) via forward-zones-recurse
  #   - Cache enabled (200k entries, 300s TTL)
  #   - Log level: info (loglevel=5)
  #   - Rate limiting disabled (ratelimit=0)
  #   - threads=16 — matches CPU limit
  # ---------------------------------------------------------------------------
  powerdns:
    image: powerdns/pdns-recursor-master:latest
    container_name: bench-powerdns
    network_mode: host
    volumes:
      - ./powerdns-recursor.yml:/etc/powerdns/recursor.yml:ro
    cpuset: "${BENCH_SERVER_CPUS:-0-15}"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${BENCH_SERVER_NCPU:-16}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rec_control", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pihole_data:
  pihole_dnsmasq:
