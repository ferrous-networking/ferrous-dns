server:
    interface: 0.0.0.0
    port: 5356
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 allow
    cache-max-ttl: 86400
    cache-min-ttl: 300
    msg-cache-size: 256m
    rrset-cache-size: 512m
    # 8 threads — matches the benchmark's server cpuset (harness pins each
    # server to the lower half of the host cores; 8 on this 8C/16T box)
    num-threads: 8
    so-reuseport: yes
    outgoing-range: 4096
    num-queries-per-thread: 2048
    # verbosity 1 = info level (matches ferrous-dns logging.level = "info")
    verbosity: 1
    # Required: the stub upstream lives on loopback.
    do-not-query-localhost: no
    # Rate limiting disabled — dnsperf saturates at high QPS
    ratelimit: 0

forward-zone:
    name: "."
    # Local catch-all stub (see stub-upstream.conf) — identical for every server
    # under test, so a cache miss costs a loopback round-trip rather than an
    # internet round-trip.
    forward-addr: 127.0.0.1@5300
