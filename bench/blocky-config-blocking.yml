# =============================================================================
# Blocky — Benchmark Configuration (scenarios B and C: blocking ON)
# =============================================================================
# Identical to blocky-config.yml except for the blocking section. Kept as a
# separate tracked file rather than patched at runtime so the exact config that
# produced a published number can be read straight out of the repository.
#
#   - Plain UDP to the local stub upstream — no DoH/DoT
#   - Blocking ENABLED against the generated 1M-rule hosts list
#   - Caching enabled (minTime: 60s / maxTime: 86400s) — matches ferrous-dns
#   - Query logging disabled — no I/O noise during measurement
#   - Rate limiting disabled — dnsperf saturates at 10k in-flight queries
#   - Log level: info — matches ferrous-dns logging.level = "info"
# =============================================================================

# -- Upstreams -----------------------------------------------------------------
upstreams:
  groups:
    default:
      - 127.0.0.1:5300
  timeout: 2s
  strategy: parallel_best   # equivalent to ferrous-dns "Parallel"

# -- Ports --------------------------------------------------------------------
ports:
  dns: 5357
  http: 4000    # used for /api/blocking/status healthcheck inside the container

# -- Caching ------------------------------------------------------------------
caching:
  minTime: 5m
  maxTime: 24h
  prefetching: true         # background refresh — equivalent to ferrous-dns cache_optimistic_refresh

# -- Blocking -----------------------------------------------------------------
# Served by the blocklist-server container. ferrous-dns and AdGuard Home load
# the exact same hosts-format file, which is what makes the comparison fair.
blocking:
  denylists:
    bench:
      - http://127.0.0.1:8081/blocklist.txt
  allowlists: {}
  clientGroupsBlock:
    default:
      - bench
  blockType: zeroIP        # answer 0.0.0.0 — same shape as the hosts rules
  loading:
    downloads:
      timeout: 5m          # 30 MB over loopback, but the parse is not instant
      attempts: 3
      cooldown: 2s
    strategy: blocking     # refuse to serve until the list is compiled, so the
                           # harness never measures a half-loaded index

# -- Logging ------------------------------------------------------------------
log:
  level: info
  format: text
  privacy: false

# -- Query log ----------------------------------------------------------------
queryLog:
  type: none
