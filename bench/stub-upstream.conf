# =============================================================================
# Local authoritative stub upstream
# =============================================================================
# Every server under test forwards here instead of to 8.8.8.8 / 1.1.1.1.
#
# Why this exists: a realistic working set is larger than any of these servers'
# caches, so there is a permanent stream of cache misses. Sending that stream to
# public resolvers over the internet makes the benchmark measure round-trip
# latency to Google rather than the server's own pipeline — a first attempt with
# public upstreams measured ferrous-dns at 5,498 QPS with 120 ms average
# latency, which is a property of the network, not of the software. It also
# makes results depend on link quality and on how the public resolvers feel
# about being sent hundreds of thousands of NXDOMAIN lookups.
#
# `local-zone: "." redirect` turns unbound into a catch-all: any query below the
# root is answered from the local-data at the zone apex, regardless of name or
# depth. Answers are instant and identical for every server, so the miss path
# costs a loopback round-trip and nothing else.
#
# The stub is pinned to the load-generator core set, not the server's: taking
# cycles from dnsperf understates every server equally, whereas taking them from
# the server under test would not.
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5300
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    num-threads: 4
    so-reuseport: yes
    access-control: 127.0.0.0/8 allow

    # No recursion, no root hints, no outbound traffic of any kind.
    module-config: "iterator"
    root-hints: ""
    harden-dnssec-stripped: no
    qname-minimisation: no

    # Answer everything, at every depth, for every type the generator emits.
    local-zone: "." redirect
    local-data: ". 3600 IN A 192.0.2.1"
    local-data: ". 3600 IN AAAA 2001:db8::1"
    local-data: ". 3600 IN MX 10 mail.bench.invalid."
    local-data: ". 3600 IN TXT bench-stub"
    local-data: ". 3600 IN NS ns.bench.invalid."
    local-data: ". 3600 IN PTR host.bench.invalid."

    # The stub must never be the bottleneck.
    ratelimit: 0
    ip-ratelimit: 0
    msg-cache-size: 4m
    rrset-cache-size: 4m
    outgoing-range: 128
    num-queries-per-thread: 4096
