name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0, v0.1.1, v1.0.0)'
        required: true
        type: string
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      # The release PR wrote this section and a maintainer reviewed it, so it is
      # published as merged rather than regenerated.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          bash scripts/changelog-section.sh "$VERSION" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  build-binaries:
    name: Build ${{ matrix.asset_name }}
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_name: ferrous-dns-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset_name: ferrous-dns-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Strip binary
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace \
            rust:alpine strip target/${{ matrix.target }}/release/ferrous-dns || true

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ferrous-dns
          cd ../../..
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
          echo "Created archive:"
          ls -lh ${{ matrix.asset_name }}.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

  # docker.yml and docs.yml both listen for `release-created`. It is sent with
  # the PAT because events raised with GITHUB_TOKEN start no workflow.
  trigger-docker:
    name: Trigger Docker and docs
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          event-type: release-created
          client-payload: '{"version": "${{ needs.create-release.outputs.version }}"}'

      - name: Success notification
        run: |
          echo "✅ Release ${{ needs.create-release.outputs.version }} created successfully"
          echo "✅ Binaries built: ferrous-dns-linux-amd64, ferrous-dns-linux-arm64"
          echo "✅ Docker build and docs deploy triggered"
