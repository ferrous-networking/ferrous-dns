name: PR Triage

# Jobs that write to the pull request (labels, reviewers). They run on
# pull_request_target because a `pull_request` run from a fork only gets a
# read-only token, so they used to fail with 403 on every external PR.
#
# pull_request_target runs with a write token in the base repo's context:
# never check out or execute code from the PR here. Every action below only
# calls the GitHub API, and they are pinned to commit SHAs for the same reason.

on:
  pull_request_target:
    # `edited` re-labels a PR whose title changed its type.
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]

permissions: {}

jobs:
  labels:
    name: Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The kind of change, from the Conventional Commits type in the title
      # (pr-validation.yml enforces the format). Runs before the subject step
      # so that dropping a stale `documentation` type label cannot undo the
      # one the docs paths add.
      - name: Type label from the title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TYPE_LABELS = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              perf: 'performance',
              refactor: 'refactor',
            };
            const typeOf = (title) => (/^(\w+)(?:\([^)]*\))?!?:/.exec(title) || [])[1];
            const pr = context.payload.pull_request;
            const has = (name) => pr.labels.some((l) => l.name === name);
            const label = TYPE_LABELS[typeOf(pr.title)];
            const previous = context.payload.changes?.title?.from;
            const stale = previous && TYPE_LABELS[typeOf(previous)];

            if (stale && stale !== label && has(stale)) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: pr.number,
                name: stale,
              });
            }
            if (label && !has(label)) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: [label],
              });
            }

      # The subject (dns, cache, web, …), from the changed paths. The config is
      # read from the base branch, like the rest of this workflow.
      - name: Subject labels from the changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml

  suggest-reviewers:
    name: Suggest Reviewers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Suggest reviewers
        uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
        with:
          configuration-path: '.github/auto-assign.yml'
        continue-on-error: true
