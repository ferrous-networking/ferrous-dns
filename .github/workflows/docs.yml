name: Deploy Docs

# The site describes the latest release, not main. It is published when
# release.yml announces a release — the same `release-created` dispatch that
# starts docker.yml — and built from that release's tag. A dispatch run sits on
# the default branch, which is the only ref the `github-pages` environment
# deploys from, so building a tag needs no extra environment policy.
#
# A manual run republishes a tag (the latest release unless one is given), and
# pull requests that touch the docs get the strict build as a check, with no
# deploy.

on:
  repository_dispatch:
    types: [release-created]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to publish (e.g. v0.9.25). Defaults to the latest release.'
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build MkDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-revision-date-localized reads each page's history.
          fetch-depth: 0

      - name: Check out the release tag
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ github.event.client_payload.version || inputs.ref }}
        run: |
          if [[ -z "$REF" ]]; then
            REF=$(git describe --tags --abbrev=0 --match 'v*.*.*')
          fi
          echo "Publishing the docs of ${REF}"
          git checkout --detach "refs/tags/${REF}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
