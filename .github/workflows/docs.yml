name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Same PAT the release trigger pushes with: main is protected, and
          # the sync step below has to push back to it. Falls back to the
          # default token so a fork without the secret still builds.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The banners are machine-owned: this rewrites them to whatever
      # Cargo.toml says, so a version bump never has to remember to touch
      # docs/. The remaining consistency checks still fail the build, because
      # they need a human to write something.
      - name: Sync docs with the workspace version
        run: bash scripts/check-docs-version.sh --fix

      - name: Build site
        run: mkdocs build --strict

      # site/ is tracked, so it has to be regenerated whenever docs/ changes.
      # Doing it here is what keeps it from drifting between hand-run builds.
      # `[skip ci]` stops this commit from starting another round of
      # workflows: the site it would build is the one already uploaded below.
      - name: Commit the synced docs and regenerated site
        if: github.event_name == 'push'
        run: |
          if [[ -z "$(git status --porcelain docs site)" ]]; then
            echo "docs/ and site/ are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs site
          git commit -m "docs: sync version banners and regenerate the site [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
