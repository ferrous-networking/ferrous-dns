# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Keeps dependencies up to date and opens security fix PRs automatically.
# Regular version bumps run weekly (Mondays) to keep PR noise low; security
# updates are opened by Dependabot as soon as an advisory is published,
# regardless of the schedule below.
version: 2

updates:
  # ---- Rust / Cargo workspace --------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Batch non-breaking updates into a single PR to reduce churn.
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions ----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # ---- Docker base images ------------------------------------------------
  # Covers ./Dockerfile, ./Dockerfile.release and ./bench/Dockerfile.ferrous.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/bench"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"

  # ---- MkDocs documentation toolchain (pip) ------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "documentation"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
