name: Feature request
description: Suggest something Ferrous DNS should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the [open issues](https://github.com/ferrous-networking/ferrous-dns/issues) and the [milestones](https://github.com/ferrous-networking/ferrous-dns/milestones) first — it may already be planned. Open questions and early ideas fit better in [Discussions](https://github.com/ferrous-networking/ferrous-dns/discussions).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it should behave. Config keys, UI or API shape are welcome but optional.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and prior art
      description: Workarounds you use now, or how Pi-hole, AdGuard Home, Unbound and others handle it.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
