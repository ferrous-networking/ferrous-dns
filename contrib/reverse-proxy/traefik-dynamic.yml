# Ferrous DNS (dashboard, both APIs and DoH) behind Traefik: the routes.
# Guide: https://ferrous-networking.github.io/ferrous-dns/operations/tls-reverse-proxy/
# Replace dns.example.com.
#
# ferrous-dns serves HTTPS itself ([server.web_tls] with its own certificate),
# so the session cookie keeps its Secure flag. Traefik checks that certificate
# against a copy of it (ferrous-dns-upstream.pem) instead of skipping the check.

http:
  routers:
    ferrous-dns:
      rule: Host(`dns.example.com`)
      entryPoints:
        - websecure
      middlewares:
        - ferrous-dns-headers
      service: ferrous-dns
      tls:
        certResolver: letsencrypt

  middlewares:
    ferrous-dns-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: same-origin

  services:
    ferrous-dns:
      loadBalancer:
        serversTransport: ferrous-dns
        servers:
          - url: https://127.0.0.1:8080

  serversTransports:
    ferrous-dns:
      # The certificate ferrous-dns generates is issued to "localhost" and "ferrous-dns".
      serverName: localhost
      rootCAs:
        - /etc/traefik/ferrous-dns-upstream.pem
