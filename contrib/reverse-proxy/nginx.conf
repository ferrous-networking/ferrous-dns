# Ferrous DNS (dashboard, both APIs and DoH) behind nginx.
# Guide: https://ferrous-networking.github.io/ferrous-dns/operations/tls-reverse-proxy/
# Install as /etc/nginx/conf.d/ferrous-dns.conf and replace dns.example.com.
#
# ferrous-dns serves HTTPS itself ([server.web_tls] with its own certificate),
# so the session cookie keeps its Secure flag. nginx checks that certificate
# against a copy of it (ferrous-dns-upstream.pem) instead of skipping the check.

server {
    listen 80;
    listen [::]:80;
    server_name dns.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx before 1.25.1: drop this line and write "listen 443 ssl http2;" above.
    http2 on;
    server_name dns.example.com;

    ssl_certificate     /etc/letsencrypt/live/dns.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/ferrous-dns-upstream.pem;
        # The certificate ferrous-dns generates is issued to "localhost" and "ferrous-dns".
        proxy_ssl_name localhost;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
