# git-cliff configuration (https://git-cliff.org/docs/configuration), v2.x.
#
# CHANGELOG.md is the source of the release notes: the release pull request
# prepends the new section (release-pr.yml), maintainers can edit it in
# review, and release.yml publishes that section verbatim. The GitHub remote
# credits each pull request's author, so generating needs a token in
# GITHUB_TOKEN (`gh auth token` works locally).

[remote.github]
owner = "ferrous-networking"
repo = "ferrous-dns"

[changelog]
# `--prepend` swaps this exact text for a freshly rendered copy, so the
# section marker below always sits right above the newest release. It is what
# docs/changelog.md includes (pymdownx.snippets reads to end of file).
header = """
# Changelog

All notable changes to Ferrous DNS, newest first. Each entry links the pull \
request that made it and credits its author; the section of a release is also \
its [GitHub Release](https://github.com/ferrous-networking/ferrous-dns/releases) notes. \
Releases up to v0.9.3 predate this file and are listed only on GitHub Releases.

<!-- --8<-- [start:releases] -->
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]\
({{ self::remote_url() }}/{% if previous.version %}compare/{{ previous.version }}...{{ version }}{% else %}releases/tag/{{ version }}{% endif %}) \
- {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**breaking:** {% endif %}\
{% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}\
{% endfor %}
{% endfor %}\
{% set_global first_timers = [] %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}\
{% if contributor.username and contributor.username is not ending_with("[bot]") %}\
{% set_global first_timers = first_timers | concat(with=contributor) %}\
{% endif %}\
{% endfor %}\
{% if first_timers | length > 0 %}
### 🎉 New contributors
{% for contributor in first_timers %}
- @{{ contributor.username }} made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}\
{% endfor %}
{% endif %}\
{% raw %}\n{% endraw %}\
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""

trim = false

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
# The PR number is linked from the GitHub remote, so drop the "(#123)" GitHub
# appends to squash-merge titles.
commit_preprocessors = [{ pattern = '(?m) *\(#[0-9]+\)$', replace = "" }]

# The first matching parser wins. The HTML comments only order the groups;
# the template strips them.
commit_parsers = [
    # Bot bookkeeping from the old release flow, and the release commits.
    { message = "^docs: sync version banners", skip = true },
    { message = "^chore: bump version", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^\\w+\\(deps\\)", group = "<!-- 07 -->⬆️ Dependencies" },
    { message = "^feat", group = "<!-- 00 -->✨ Features" },
    { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 03 -->♻️ Refactor" },
    { message = "^docs?", group = "<!-- 04 -->📚 Documentation" },
    { message = "^test", group = "<!-- 05 -->🧪 Testing" },
    { message = "^style", group = "<!-- 06 -->🎨 Styling" },
    { message = "^build", group = "<!-- 08 -->📦 Build" },
    { message = "^ci", group = "<!-- 09 -->👷 CI/CD" },
    { message = "^chore", group = "<!-- 10 -->🔧 Miscellaneous" },
    { message = "^revert", group = "<!-- 11 -->⏪ Revert" },
    { message = ".*", group = "<!-- 12 -->📋 Other" },
]

tag_pattern = "v[0-9]*"
sort_commits = "oldest"
